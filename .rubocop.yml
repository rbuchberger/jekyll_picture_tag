# Exclude unimportant files
require:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  NewCops: enable
  # Lint against the oldest supported ruby: the floor in required_ruby_version.
  # Set explicitly so it can't be inferred from .ruby-version.
  TargetRubyVersion: 3.0
  Include:
    - 'lib/**/*.rb'
    - 'test/**/*.rb'
    - 'Gemfile'
    - 'Rakefile'
    - '*.gemspec'

  Exclude:
    - '**/.bundle/*'
    - '**/.git/*'
    - '**/.github/*'
    - '**/bin/**/*'
    - '**/coverage/**/*'
    - '**/docs/**/*'
    - '**/imagemagick/*'
    - '**/pkg/**/*'
    - '**/vendor/**/*'

Layout/LineLength:
  Max: 120

# Disabled Cops
Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

Metrics/MethodLength:
  Enabled: false
