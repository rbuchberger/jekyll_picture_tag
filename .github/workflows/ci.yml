name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test (ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        include:
          - ruby: "3.0"
            runs-on: ubuntu-22.04

    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libjpeg-dev webp libpng-dev libavif-dev libheif-dev libopenjpip7 imagemagick libvips-tools build-essential

          # libheif 1.17 (24.04) moved its codecs out into plugin packages, so
          # the base install can read avif but not write it. 22.04 builds them
          # in and has no such packages, hence the check.
          if apt-cache show libheif-plugin-aomenc > /dev/null 2>&1; then
            sudo apt-get install --yes libheif-plugin-aomenc libheif-plugin-aomdec
          fi

      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  rubocop:
    name: rubocop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # Match the version in mise.toml so local dev & CI agree
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
